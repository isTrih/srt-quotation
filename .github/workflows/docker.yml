name: Verify, build and push Bun Docker image
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run test:web
      - run: bun run build
      - run: bun run test:integration
  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: trihlp/srt-quotation
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Build Linux image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/srt-quotation-image.tar
          build-args: |
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
      - name: Save image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: printf '%s\n' "$IMAGE_TAGS" > "$RUNNER_TEMP/image-tags.txt"
      - name: Save built image
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: srt-quotation-linux-oci
          path: |
            ${{ runner.temp }}/srt-quotation-image.tar
            ${{ runner.temp }}/image-tags.txt
          overwrite: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  push:
    name: push
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: srt-quotation-linux-oci
          path: ${{ runner.temp }}/image
      - name: Install image transfer tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Docker Hub login
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_TOKEN" || { echo "Set repository secret DOCKERHUB_TOKEN for trihlp"; exit 1; }
          printf '%s' "$DOCKERHUB_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/dockerhub-auth.json" --username trihlp --password-stdin docker.io
      - name: Push the built image without rebuilding
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            test -n "$tag" || continue
            case "$tag" in
              trihlp/srt-quotation:*) ;;
              *) echo "Unexpected image tag: $tag"; exit 1 ;;
            esac
            skopeo copy --all --preserve-digests --retry-times 3 \
              --authfile "$RUNNER_TEMP/dockerhub-auth.json" \
              --digestfile "$RUNNER_TEMP/published-digest.txt" \
              "oci-archive:$RUNNER_TEMP/image/srt-quotation-image.tar:${tag##*:}" "docker://$tag"
            printf 'Published `%s`\n\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/image/image-tags.txt"
          printf 'Image digest: `%s`\n' "$(cat "$RUNNER_TEMP/published-digest.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/dockerhub-auth.json"
